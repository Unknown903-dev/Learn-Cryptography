name: Collect repository traffic

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Confirm traffic token is configured
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "Add a fine-grained TRAFFIC_TOKEN secret with Administration: read access."
            exit 1
          fi

      - name: Fetch GitHub traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TRAFFIC_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/traffic/views?per=day" \
            --output /tmp/repository-views.json

          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TRAFFIC_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/traffic/clones?per=day" \
            --output /tmp/repository-clones.json

      - name: Merge traffic into the public history
        run: node .github/scripts/update-traffic.mjs

      - name: Commit updated traffic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/repository-traffic.svg .github/data/repository-traffic.json

          if git diff --cached --quiet; then
            echo "Traffic history is already current."
            exit 0
          fi

          git commit -m "chore: update repository traffic"
          git push
